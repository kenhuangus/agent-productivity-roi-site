<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.4" />

  <!-- Geometric Grid & Circuit Rays -->
  <path d="M 80 390 L 432 390" stroke="#10b981" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <path d="M 80 290 L 432 290" stroke="#10b981" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <path d="M 80 190 L 432 190" stroke="#10b981" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <path d="M 170 120 L 170 410" stroke="#10b981" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <path d="M 340 120 L 340 410" stroke="#10b981" stroke-width="3" stroke-opacity="0.25" stroke-dasharray="8 8" />

  <!-- Autonomous Agent Orbit Ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="14 10" />

  <!-- Exponential ROI Growth Curve -->
  <path d="M 96 380 Q 220 370, 270 270 T 410 124" fill="none" stroke="url(#curveGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />

  <!-- Arrowhead at apex -->
  <polygon points="418,96 426,146 380,132" fill="#34d399" />

  <!-- Autonomous Agent Nodes along trajectory -->
  <circle cx="160" cy="374" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="7" />
  <circle cx="270" cy="270" r="18" fill="#0f172a" stroke="#10b981" stroke-width="8" />
  <circle cx="370" cy="165" r="15" fill="#0f172a" stroke="#34d399" stroke-width="7" />

  <!-- Central Pulse Indicator -->
  <circle cx="270" cy="270" r="7" fill="#34d399" />

  <!-- ROI Badge Text -->
  <text x="256" y="446" fill="#f8fafc" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="6" text-anchor="middle">ROI · AGENT</text>
</svg>
